name: Minecraft Java Server 1.21.9

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: 1. System Information
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " SYSTEM INFORMATION"
          Write-Host "========================================="

          $os = Get-CimInstance Win32_OperatingSystem

          $ram = [math]::Round(
              $os.TotalVisibleMemorySize / 1MB,
              2
          )

          Write-Host "OS: $($os.Caption)"
          Write-Host "RAM: $ram GB"

          $cpu = Get-CimInstance Win32_Processor

          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Logical CPUs: $($cpu.NumberOfLogicalProcessors)"


      # =========================================================
      # 2. INSTALL JAVA 21
      # =========================================================
      - name: 2. Install Java 21
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " JAVA 21"
          Write-Host "========================================="

          Write-Host "Installing Temurin Java 21..."

          winget install `
            --id EclipseAdoptium.Temurin.21.JDK `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          Start-Sleep -Seconds 8

          Write-Host ""
          Write-Host "Searching for Java 21..."

          $java21Candidates = @()

          $searchPaths = @(
              "C:\Program Files\Eclipse Adoptium",
              "C:\Program Files\Java",
              "C:\Program Files\AdoptOpenJDK"
          )

          foreach ($path in $searchPaths) {

              if (Test-Path $path) {

                  $found = Get-ChildItem `
                      -Path $path `
                      -Recurse `
                      -Filter "java.exe" `
                      -ErrorAction SilentlyContinue

                  foreach ($item in $found) {

                      try {

                          $output = & $item.FullName -version 2>&1 |
                              Out-String

                          Write-Host ""
                          Write-Host "Found Java:"
                          Write-Host $item.FullName
                          Write-Host $output

                          if ($output -match 'version "21\.') {
                              $java21Candidates += $item.FullName
                          }

                      }
                      catch {
                          # Ignore invalid Java binaries
                      }
                  }
              }
          }

          if ($java21Candidates.Count -eq 0) {

              Write-Host ""
              Write-Host "Java 21 was not found automatically."
              Write-Host ""
              Write-Host "Current java command:"

              where.exe java 2>&1

              java -version 2>&1

              throw "Java 21 installation/path detection failed."
          }

          # Use the first Java 21 installation found
          $java21 = $java21Candidates[0]

          Write-Host ""
          Write-Host "========================================="
          Write-Host " SELECTED JAVA 21"
          Write-Host "========================================="

          Write-Host $java21

          Write-Host ""
          Write-Host "Testing selected Java:"

          & $java21 -version 2>&1

          # Save exact Java path for ALL following steps
          "JAVA21_PATH=$java21" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          # Set JAVA_HOME
          $javaHome = Split-Path `
              (Split-Path $java21 -Parent) `
              -Parent

          "JAVA_HOME=$javaHome" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          # Put Java 21 FIRST in PATH
          $javaBin = Split-Path $java21 -Parent

          $env:Path = "$javaBin;$env:Path"

          Write-Host ""
          Write-Host "JAVA_HOME:"
          Write-Host $javaHome

          Write-Host ""
          Write-Host "Final java command:"

          & $java21 -version 2>&1


      # =========================================================
      # 3. VERIFY JAVA 21 BEFORE DOING ANYTHING ELSE
      # =========================================================
      - name: 3. Verify Java 21
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " VERIFY JAVA"
          Write-Host "========================================="

          if (-not $env:JAVA21_PATH) {
              throw "JAVA21_PATH is missing."
          }

          if (-not (Test-Path $env:JAVA21_PATH)) {
              throw "Java 21 executable does not exist: $env:JAVA21_PATH"
          }

          Write-Host "Java executable:"
          Write-Host $env:JAVA21_PATH

          Write-Host ""
          Write-Host "Java version:"

          $javaVersion = & $env:JAVA21_PATH -version 2>&1 |
              Out-String

          Write-Host $javaVersion

          if ($javaVersion -notmatch 'version "21\.') {
              throw "The selected Java executable is NOT Java 21."
          }

          Write-Host ""
          Write-Host "JAVA 21 VERIFIED SUCCESSFULLY."


      # =========================================================
      # 4. CREATE MINECRAFT DIRECTORY
      # =========================================================
      - name: 4. Create Minecraft Directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $serverDir = "C:\Minecraft"

          if (Test-Path $serverDir) {
              Remove-Item `
                  $serverDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $serverDir `
              -Force |
              Out-Null

          Write-Host ""
          Write-Host "Minecraft directory created:"
          Write-Host $serverDir


      # =========================================================
      # 5. DOWNLOAD PAPER 1.21.9
      # =========================================================
      - name: 5. Download Paper 1.21.9
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $minecraftVersion = "1.21.9"
          $serverDir = "C:\Minecraft"

          $api = `
              "https://fill.papermc.io/v3/projects/paper/versions/$minecraftVersion/builds"

          $headers = @{
              "User-Agent" = "Minecraft-GitHub-Actions-Server/1.0"
              "Accept"     = "application/json"
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " PAPER DOWNLOAD"
          Write-Host "========================================="

          Write-Host "Minecraft version:"
          Write-Host $minecraftVersion

          Write-Host ""
          Write-Host "Paper API:"
          Write-Host $api

          $builds = Invoke-RestMethod `
              -Uri $api `
              -Headers $headers `
              -Method Get

          if (-not $builds) {
              throw "Paper API returned no builds."
          }

          Write-Host ""
          Write-Host "Available Paper builds:"

          foreach ($build in $builds) {

              Write-Host `
                  "Build $($build.id) | Channel: $($build.channel)"
          }

          # 1.21.9 currently has no STABLE build.
          # Select newest available build.

          $latestBuild = $builds |
              Sort-Object {
                  [int]$_.id
              } -Descending |
              Select-Object -First 1

          if (-not $latestBuild) {
              throw "No Paper build found."
          }

          $buildNumber = $latestBuild.id
          $channel = $latestBuild.channel

          $downloadUrl =
              $latestBuild.downloads."server:default".url

          if (-not $downloadUrl) {
              throw "Paper download URL not found."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " SELECTED PAPER"
          Write-Host "========================================="

          Write-Host "Minecraft: $minecraftVersion"
          Write-Host "Build: $buildNumber"
          Write-Host "Channel: $channel"

          Write-Host ""
          Write-Host "Download URL:"
          Write-Host $downloadUrl

          Write-Host ""
          Write-Host "Downloading Paper..."

          Invoke-WebRequest `
              -Uri $downloadUrl `
              -Headers $headers `
              -OutFile "$serverDir\paper.jar"

          if (-not (Test-Path "$serverDir\paper.jar")) {
              throw "paper.jar was not downloaded."
          }

          $sizeMB = [math]::Round(
              (Get-Item "$serverDir\paper.jar").Length / 1MB,
              2
          )

          Write-Host ""
          Write-Host "Paper downloaded successfully."
          Write-Host "Build: $buildNumber"
          Write-Host "Channel: $channel"
          Write-Host "Size: $sizeMB MB"

          "PAPER_BUILD=$buildNumber" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PAPER_CHANNEL=$channel" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # =========================================================
      # 6. ACCEPT EULA
      # =========================================================
      - name: 6. Accept Minecraft EULA
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location C:\Minecraft

          "eula=true" |
              Set-Content `
              -Path "eula.txt" `
              -Encoding ASCII

          Write-Host "Minecraft EULA accepted."


      # =========================================================
      # 7. SERVER CONFIGURATION
      # =========================================================
      - name: 7. Configure Minecraft Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $serverDir = "C:\Minecraft"

          $properties = @"
          server-port=25565
          server-ip=
          max-players=5
          online-mode=true
          difficulty=normal
          gamemode=survival
          pvp=true
          spawn-protection=0
          view-distance=8
          simulation-distance=6
          enable-command-block=false
          enable-status=true
          allow-flight=false
          white-list=false
          enforce-whitelist=false
          motd=Aria Minecraft Server 1.21.9
          "@

          $properties |
              Set-Content `
              -Path "$serverDir\server.properties" `
              -Encoding ASCII

          Write-Host ""
          Write-Host "SERVER CONFIGURATION:"
          Write-Host ""

          Get-Content "$serverDir\server.properties"


      # =========================================================
      # 8. WINDOWS FIREWALL
      # =========================================================
      - name: 8. Configure Windows Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " WINDOWS FIREWALL"
          Write-Host "========================================="

          Get-NetFirewallRule `
              -DisplayName "Minecraft Server TCP 25565" `
              -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule `
              -ErrorAction SilentlyContinue

          New-NetFirewallRule `
              -DisplayName "Minecraft Server TCP 25565" `
              -Direction Inbound `
              -Protocol TCP `
              -LocalPort 25565 `
              -Action Allow `
              -Profile Any

          Write-Host ""
          Write-Host "Firewall rule created."

          Get-NetFirewallRule `
              -DisplayName "Minecraft Server TCP 25565" |
              Format-List `
                  DisplayName,
                  Enabled,
                  Direction,
                  Action


      # =========================================================
      # 9. RAM
      # =========================================================
      - name: 9. Configure Minecraft RAM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $totalRAM = [math]::Round(
              (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB,
              1
          )

          Write-Host ""
          Write-Host "Total RAM: $totalRAM GB"

          if ($totalRAM -ge 8) {
              $minecraftRAM = "6G"
          }
          elseif ($totalRAM -ge 6) {
              $minecraftRAM = "4G"
          }
          else {
              $minecraftRAM = "3G"
          }

          Write-Host "Minecraft RAM: $minecraftRAM"

          "MINECRAFT_RAM=$minecraftRAM" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # =========================================================
      # 10. START MINECRAFT WITH EXPLICIT JAVA 21
      # =========================================================
      - name: 10. Start Minecraft Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $serverDir = "C:\Minecraft"

          Set-Location $serverDir

          Write-Host ""
          Write-Host "========================================="
          Write-Host " STARTING MINECRAFT"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "Java executable:"
          Write-Host $env:JAVA21_PATH

          Write-Host ""
          Write-Host "Java version:"
          & $env:JAVA21_PATH -version 2>&1

          Write-Host ""
          Write-Host "Minecraft RAM:"
          Write-Host $env:MINECRAFT_RAM

          # IMPORTANT:
          # We DO NOT use "java".
          # We use the exact Java 21 executable.

          $javaArgs = @(
              "-Xms$env:MINECRAFT_RAM",
              "-Xmx$env:MINECRAFT_RAM",
              "-XX:+UseG1GC",
              "-XX:+ParallelRefProcEnabled",
              "-XX:MaxGCPauseMillis=200",
              "-jar",
              "paper.jar",
              "--nogui"
          )

          $process = Start-Process `
              -FilePath $env:JAVA21_PATH `
              -ArgumentList $javaArgs `
              -WorkingDirectory $serverDir `
              -RedirectStandardOutput "$serverDir\server.log" `
              -RedirectStandardError "$serverDir\server-error.log" `
              -PassThru

          $process.Id |
              Out-File `
              "$serverDir\server.pid" `
              -Encoding ASCII

          Write-Host ""
          Write-Host "Minecraft PID: $($process.Id)"

          Write-Host ""
          Write-Host "Waiting for Minecraft server..."

          $ready = $false

          for ($i = 1; $i -le 90; $i++) {

              Start-Sleep -Seconds 2

              if (Test-Path "$serverDir\server.log") {

                  $log = Get-Content `
                      "$serverDir\server.log" `
                      -Raw `
                      -ErrorAction SilentlyContinue

                  if ($log -match "Done \(") {

                      $ready = $true
                      break
                  }

                  if ($log -match "UnsupportedClassVersionError") {

                      Write-Host ""
                      Write-Host "JAVA VERSION ERROR DETECTED."

                      Get-Content `
                          "$serverDir\server-error.log" `
                          -Tail 100

                      throw "Paper is not running with Java 21."
                  }

                  if ($log -match "Failed to start") {
                      break
                  }
              }

              Write-Host "Waiting... $i/90"
          }

          if (-not $ready) {

              Write-Host ""
              Write-Host "========================================="
              Write-Host " SERVER LOG"
              Write-Host "========================================="

              if (Test-Path "$serverDir\server.log") {
                  Get-Content `
                      "$serverDir\server.log" `
                      -Tail 150
              }

              Write-Host ""
              Write-Host "========================================="
              Write-Host " SERVER ERROR"
              Write-Host "========================================="

              if (Test-Path "$serverDir\server-error.log") {
                  Get-Content `
                      "$serverDir\server-error.log" `
                      -Tail 150
              }

              throw "Minecraft server failed to start."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT SERVER READY"
          Write-Host "========================================="


      # =========================================================
      # 11. LOCAL PORT TEST
      # =========================================================
      - name: 11. Test Minecraft Port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "Testing 127.0.0.1:25565..."

          $result = Test-NetConnection `
              -ComputerName 127.0.0.1 `
              -Port 25565 `
              -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              throw "Minecraft TCP 25565 is NOT reachable."
          }

          Write-Host ""
          Write-Host "SUCCESS!"
          Write-Host "127.0.0.1:25565 is OPEN."


      # =========================================================
      # 12. INSTALL PLAYIT
      # =========================================================
      - name: 12. Install Playit
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " INSTALL PLAYIT"
          Write-Host "========================================="

          winget install `
              --id DevelopedMethods.playit `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

          Start-Sleep -Seconds 5

          $env:Path = `
              [System.Environment]::GetEnvironmentVariable(
                  "Path",
                  "Machine"
              ) `
              + ";" `
              + [System.Environment]::GetEnvironmentVariable(
                  "Path",
                  "User"
              )

          Write-Host ""
          Write-Host "Searching for playit.exe..."

          $playit = Get-ChildItem `
              -Path "C:\Program Files","C:\Program Files (x86)" `
              -Filter "playit.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

          if (-not $playit) {
              throw "playit.exe was not found."
          }

          Write-Host ""
          Write-Host "Playit executable:"
          Write-Host $playit.FullName

          "PLAYIT_EXE=$($playit.FullName)" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # =========================================================
      # 13. START PLAYIT
      # =========================================================
      - name: 13. Start Playit Tunnel
        shell: powershell
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:PLAYIT_SECRET)) {

              throw @"
          PLAYIT_SECRET is missing.

          Go to:

          Repository
          ->
          Settings
          ->
          Secrets and variables
          ->
          Actions
          ->
          New repository secret

          Name:

          PLAYIT_SECRET

          Then put your Playit Agent Secret there.
          "@
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " STARTING PLAYIT"
          Write-Host "========================================="

          $playitLog =
              "C:\Minecraft\playit.log"

          $playitError =
              "C:\Minecraft\playit-error.log"

          $args = @(
              "--secret",
              $env:PLAYIT_SECRET
          )

          $process = Start-Process `
              -FilePath $env:PLAYIT_EXE `
              -ArgumentList $args `
              -WorkingDirectory "C:\Minecraft" `
              -RedirectStandardOutput $playitLog `
              -RedirectStandardError $playitError `
              -PassThru

          $process.Id |
              Out-File `
              "C:\Minecraft\playit.pid" `
              -Encoding ASCII

          Write-Host "Playit PID: $($process.Id)"

          Start-Sleep -Seconds 15

          Write-Host ""
          Write-Host "========== PLAYIT LOG =========="

          if (Test-Path $playitLog) {
              Get-Content `
                  $playitLog `
                  -Tail 100
          }

          Write-Host ""
          Write-Host "========== PLAYIT ERROR =========="

          if (Test-Path $playitError) {
              Get-Content `
                  $playitError `
                  -Tail 100
          }


      # =========================================================
      # 14. FIND PUBLIC ADDRESS
      # =========================================================
      - name: 14. Find Public Minecraft Address
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $logFile =
              "C:\Minecraft\playit.log"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " FIND PUBLIC MINECRAFT ADDRESS"
          Write-Host "========================================="

          $publicAddress = $null

          for ($i = 1; $i -le 36; $i++) {

              Start-Sleep -Seconds 5

              if (-not (Test-Path $logFile)) {
                  Write-Host "Playit log not ready... $i/36"
                  continue
              }

              $log = Get-Content `
                  $logFile `
                  -Raw `
                  -ErrorAction SilentlyContinue

              # Standard Playit addresses
              $matches = [regex]::Matches(
                  $log,
                  '(?i)([a-z0-9.-]+\.(?:playit\.gg|gl\.at\.ply\.gg)):(\d+)'
              )

              foreach ($match in $matches) {

                  $hostName =
                      $match.Groups[1].Value

                  $port =
                      $match.Groups[2].Value

                  if ($port -ne "25565") {

                      $publicAddress =
                          "$hostName`:$port"

                      break
                  }
              }

              if ($publicAddress) {
                  break
              }

              Write-Host "Public address not found yet... $i/36"
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT CONNECTION"
          Write-Host "========================================="

          if ($publicAddress) {

              Write-Host ""
              Write-Host "PUBLIC ADDRESS:"
              Write-Host $publicAddress

              Write-Host ""
              Write-Host "VERSION:"
              Write-Host "Minecraft Java 1.21.9"

              Write-Host ""
              Write-Host "MAX PLAYERS:"
              Write-Host "5"

              Write-Host ""
              Write-Host "========================================="

              "MINECRAFT_PUBLIC_ADDRESS=$publicAddress" |
                  Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

              @"
          # 🎮 Minecraft Server

          ## Public Address

          **$publicAddress**

          ## Version

          Minecraft Java **1.21.9**

          ## Max Players

          **5**

          ## Paper Build

          **$env:PAPER_BUILD**

          ## Paper Channel

          **$env:PAPER_CHANNEL**

          ## Minecraft RAM

          **$env:MINECRAFT_RAM**
          "@ |
                  Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Encoding utf8
          }
          else {

              Write-Host ""
              Write-Host "PUBLIC ADDRESS NOT DETECTED."

              Write-Host ""
              Write-Host "========== PLAYIT LOG =========="

              if (Test-Path $logFile) {
                  Get-Content $logFile
              }

              Write-Host ""
              Write-Host "========== PLAYIT ERROR =========="

              if (Test-Path "C:\Minecraft\playit-error.log") {
                  Get-Content `
                      "C:\Minecraft\playit-error.log"
              }

              throw "Could not detect Playit public address."
          }


      # =========================================================
      # 15. FINAL STATUS
      # =========================================================
      - name: 15. Final Server Status
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host " FINAL MINECRAFT SERVER STATUS"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "Java:"
          & $env:JAVA21_PATH -version 2>&1

          Write-Host ""
          Write-Host "Minecraft RAM:"
          Write-Host $env:MINECRAFT_RAM

          Write-Host ""
          Write-Host "Minecraft process:"

          Get-Process java `
              -ErrorAction SilentlyContinue |
              Select-Object `
                  Id,
                  ProcessName,
                  CPU,
                  WorkingSet64

          Write-Host ""
          Write-Host "Listening port:"

          Get-NetTCPConnection `
              -LocalPort 25565 `
              -State Listen `
              -ErrorAction SilentlyContinue |
              Format-Table `
                  LocalAddress,
                  LocalPort,
                  State,
                  OwningProcess

          Write-Host ""
          Write-Host "PUBLIC MINECRAFT ADDRESS:"

          Write-Host $env:MINECRAFT_PUBLIC_ADDRESS


      # =========================================================
      # 16. KEEP SERVER ALIVE
      # =========================================================
      - name: 16. Keep Minecraft Server Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT SERVER IS RUNNING"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "PUBLIC ADDRESS:"
          Write-Host $env:MINECRAFT_PUBLIC_ADDRESS

          Write-Host ""
          Write-Host "VERSION: 1.21.9"
          Write-Host "PAPER BUILD: $env:PAPER_BUILD"
          Write-Host "PLAYERS: 5"
          Write-Host "RAM: $env:MINECRAFT_RAM"
          Write-Host ""

          # GitHub job maximum = 360 minutes.
          # Keep server alive for ~5h45m.

          for ($i = 1; $i -le 345; $i++) {

              Start-Sleep -Seconds 60

              $minecraft =
                  Get-Process java `
                      -ErrorAction SilentlyContinue

              if (-not $minecraft) {

                  Write-Host ""
                  Write-Host "Minecraft stopped unexpectedly."

                  if (Test-Path "C:\Minecraft\server.log") {

                      Get-Content `
                          "C:\Minecraft\server.log" `
                          -Tail 100
                  }

                  exit 1
              }

              Write-Host `
                  "[$i/345] Minecraft running | PID: $($minecraft.Id)"
          }


      # =========================================================
      # 17. UPLOAD LOGS
      # =========================================================
      - name: 17. Upload Minecraft Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-logs
          path: C:\Minecraft
          if-no-files-found: ignore
          retention-days: 1
