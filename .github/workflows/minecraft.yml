name: Minecraft Java 1.21.9 Server

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. SYSTEM INFO
      # ============================================================
      - name: 1. System Information
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " SYSTEM INFORMATION"
          Write-Host "========================================="

          $os = Get-CimInstance Win32_OperatingSystem

          $ram = [math]::Round(
              $os.TotalVisibleMemorySize / 1MB,
              2
          )

          $cpu = Get-CimInstance Win32_Processor

          Write-Host "OS: $($os.Caption)"
          Write-Host "RAM: $ram GB"
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "CPU Threads: $($cpu.NumberOfLogicalProcessors)"


      # ============================================================
      # 2. INSTALL JAVA 21
      # ============================================================
      - name: 2. Install Java 21
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " JAVA 21"
          Write-Host "========================================="

          winget install `
            --id EclipseAdoptium.Temurin.21.JDK `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          Write-Host ""
          Write-Host "Java 21 installation finished."

          Start-Sleep -Seconds 8


      # ============================================================
      # 3. FIND JAVA 21
      # ============================================================
      - name: 3. Locate Java 21
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " LOCATING JAVA 21"
          Write-Host "========================================="

          $java21 = $null

          $roots = @(
              "C:\Program Files\Eclipse Adoptium",
              "C:\Program Files\Java",
              "C:\Program Files\AdoptOpenJDK"
          )

          foreach ($root in $roots) {

              if (-not (Test-Path $root)) {
                  continue
              }

              Write-Host ""
              Write-Host "Searching:"
              Write-Host $root

              $candidates = Get-ChildItem `
                  -Path $root `
                  -Filter "java.exe" `
                  -Recurse `
                  -File `
                  -ErrorAction SilentlyContinue

              foreach ($candidate in $candidates) {

                  $oldPreference =
                      $ErrorActionPreference

                  $ErrorActionPreference =
                      "Continue"

                  $versionText = (
                      & $candidate.FullName -version 2>&1 |
                      Out-String
                  )

                  $ErrorActionPreference =
                      $oldPreference

                  Write-Host ""
                  Write-Host "Candidate:"
                  Write-Host $candidate.FullName

                  Write-Host $versionText

                  if ($versionText -match 'version "21\.') {

                      $java21 =
                          $candidate.FullName

                      break
                  }
              }

              if ($java21) {
                  break
              }
          }


          if (-not $java21) {

              Write-Host ""
              Write-Host "========================================="
              Write-Host " JAVA 21 NOT FOUND"
              Write-Host "========================================="

              Write-Host ""
              Write-Host "Installed Java locations:"

              where.exe java 2>&1 |
                  Out-Host

              throw `
                  "Java 21 could not be located."
          }


          Write-Host ""
          Write-Host "========================================="
          Write-Host " JAVA 21 FOUND"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "Java:"
          Write-Host $java21

          $oldPreference =
              $ErrorActionPreference

          $ErrorActionPreference =
              "Continue"

          & $java21 -version 2>&1 |
              Out-Host

          $ErrorActionPreference =
              $oldPreference


          "JAVA21_PATH=$java21" |
              Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 4. VERIFY JAVA
      # ============================================================
      - name: 4. Verify Java 21
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " VERIFY JAVA 21"
          Write-Host "========================================="

          if (-not $env:JAVA21_PATH) {
              throw "JAVA21_PATH is empty."
          }

          if (-not (Test-Path $env:JAVA21_PATH)) {
              throw "Java executable does not exist."
          }

          $oldPreference =
              $ErrorActionPreference

          $ErrorActionPreference =
              "Continue"

          $versionText = (
              & $env:JAVA21_PATH -version 2>&1 |
              Out-String
          )

          $ErrorActionPreference =
              $oldPreference

          Write-Host $versionText

          if ($versionText -notmatch 'version "21\.') {
              throw "Selected Java is not Java 21."
          }

          Write-Host ""
          Write-Host "JAVA 21 VERIFIED."


      # ============================================================
      # 5. CREATE SERVER DIRECTORY
      # ============================================================
      - name: 5. Prepare Minecraft
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $serverDir = "C:\Minecraft"

          if (Test-Path $serverDir) {

              Remove-Item `
                  $serverDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $serverDir `
              -Force |
              Out-Null

          Write-Host ""
          Write-Host "Minecraft directory:"
          Write-Host $serverDir


      # ============================================================
      # 6. DOWNLOAD PAPER
      # ============================================================
      - name: 6. Download Paper 1.21.9
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $minecraftVersion = "1.21.9"
          $serverDir = "C:\Minecraft"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " PAPER 1.21.9"
          Write-Host "========================================="

          $api =
              "https://fill.papermc.io/v3/projects/paper/versions/$minecraftVersion/builds"

          $headers = @{
              "User-Agent" =
                  "Aria-Minecraft-GitHub-Actions/1.0"

              "Accept" =
                  "application/json"
          }

          Write-Host ""
          Write-Host "Querying:"
          Write-Host $api

          $builds = Invoke-RestMethod `
              -Uri $api `
              -Headers $headers `
              -Method Get

          if (-not $builds) {
              throw "Paper API returned no builds."
          }

          Write-Host ""
          Write-Host "Available builds:"

          foreach ($build in $builds) {

              Write-Host `
                  "Build $($build.id) | Channel $($build.channel)"
          }

          # Use newest available build.
          # Do NOT require STABLE because 1.21.9
          # may not expose a STABLE channel.

          $latest =
              $builds |
              Sort-Object {
                  [int]$_.id
              } -Descending |
              Select-Object -First 1

          if (-not $latest) {
              throw "Could not select Paper build."
          }

          $buildNumber =
              $latest.id

          $channel =
              $latest.channel

          $downloadUrl =
              $latest.downloads."server:default".url

          if (-not $downloadUrl) {
              throw "Paper download URL is missing."
          }

          Write-Host ""
          Write-Host "Selected build:"
          Write-Host $buildNumber

          Write-Host ""
          Write-Host "Channel:"
          Write-Host $channel

          Write-Host ""
          Write-Host "Downloading Paper..."

          Invoke-WebRequest `
              -Uri $downloadUrl `
              -Headers $headers `
              -OutFile "$serverDir\paper.jar"

          if (-not (Test-Path "$serverDir\paper.jar")) {
              throw "paper.jar was not downloaded."
          }

          $size =
              [math]::Round(
                  (Get-Item "$serverDir\paper.jar").Length / 1MB,
                  2
              )

          Write-Host ""
          Write-Host "Paper downloaded."
          Write-Host "Size: $size MB"

          "PAPER_BUILD=$buildNumber" |
              Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PAPER_CHANNEL=$channel" |
              Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 7. EULA
      # ============================================================
      - name: 7. Accept EULA
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Content `
              -Path "C:\Minecraft\eula.txt" `
              -Value "eula=true" `
              -Encoding ASCII

          Write-Host "Minecraft EULA accepted."


      # ============================================================
      # 8. SERVER PROPERTIES
      # ============================================================
      - name: 8. Configure Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $config = @"
          server-port=25565
          server-ip=
          max-players=5
          online-mode=true
          difficulty=normal
          gamemode=survival
          pvp=true
          spawn-protection=0
          view-distance=8
          simulation-distance=6
          enable-command-block=false
          enable-status=true
          allow-flight=false
          white-list=false
          enforce-whitelist=false
          motd=Aria Minecraft Server 1.21.9
          "@

          Set-Content `
              -Path "C:\Minecraft\server.properties" `
              -Value $config `
              -Encoding ASCII

          Write-Host ""
          Write-Host "========================================="
          Write-Host " SERVER CONFIG"
          Write-Host "========================================="

          Get-Content `
              "C:\Minecraft\server.properties"


      # ============================================================
      # 9. FIREWALL
      # ============================================================
      - name: 9. Configure Windows Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " WINDOWS FIREWALL"
          Write-Host "========================================="

          Get-NetFirewallRule `
              -DisplayName "Minecraft Server TCP 25565" `
              -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule `
              -ErrorAction SilentlyContinue

          New-NetFirewallRule `
              -DisplayName "Minecraft Server TCP 25565" `
              -Direction Inbound `
              -Protocol TCP `
              -LocalPort 25565 `
              -Action Allow `
              -Profile Any |
              Out-Host

          Write-Host ""
          Write-Host "Firewall configured."


      # ============================================================
      # 10. RAM
      # ============================================================
      - name: 10. Configure RAM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $totalRAM = [math]::Round(
              (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB,
              1
          )

          if ($totalRAM -ge 8) {

              $minecraftRAM = "6G"

          }
          elseif ($totalRAM -ge 6) {

              $minecraftRAM = "4G"

          }
          else {

              $minecraftRAM = "3G"
          }

          Write-Host ""
          Write-Host "Total RAM:"
          Write-Host "$totalRAM GB"

          Write-Host ""
          Write-Host "Minecraft RAM:"
          Write-Host $minecraftRAM

          "MINECRAFT_RAM=$minecraftRAM" |
              Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 11. START MINECRAFT
      # ============================================================
      - name: 11. Start Minecraft
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $serverDir =
              "C:\Minecraft"

          Set-Location $serverDir

          Write-Host ""
          Write-Host "========================================="
          Write-Host " STARTING MINECRAFT"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "Java:"
          Write-Host $env:JAVA21_PATH

          Write-Host ""
          Write-Host "RAM:"
          Write-Host $env:MINECRAFT_RAM

          # --------------------------------------------------------
          # Make sure old Java processes do not interfere.
          # --------------------------------------------------------

          Get-Process java `
              -ErrorAction SilentlyContinue |
              Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          # --------------------------------------------------------
          # Start Paper
          # --------------------------------------------------------

          $arguments = @(
              "-Xms$env:MINECRAFT_RAM",
              "-Xmx$env:MINECRAFT_RAM",
              "-XX:+UseG1GC",
              "-XX:+ParallelRefProcEnabled",
              "-XX:MaxGCPauseMillis=200",
              "-jar",
              "paper.jar",
              "--nogui"
          )

          $minecraftProcess =
              Start-Process `
                  -FilePath $env:JAVA21_PATH `
                  -ArgumentList $arguments `
                  -WorkingDirectory $serverDir `
                  -RedirectStandardOutput "$serverDir\server.log" `
                  -RedirectStandardError "$serverDir\server-error.log" `
                  -PassThru

          $minecraftProcess.Id |
              Out-File `
              "$serverDir\server.pid" `
              -Encoding ASCII

          Write-Host ""
          Write-Host "Minecraft PID:"
          Write-Host $minecraftProcess.Id


      # ============================================================
      # 12. WAIT FOR SERVER READY
      # ============================================================
      - name: 12. Wait For Minecraft
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $serverDir =
              "C:\Minecraft"

          $ready =
              $false

          Write-Host ""
          Write-Host "========================================="
          Write-Host " WAITING FOR MINECRAFT"
          Write-Host "========================================="

          for ($i = 1; $i -le 120; $i++) {

              Start-Sleep -Seconds 2

              # ----------------------------------------------------
              # Check Minecraft process
              # ----------------------------------------------------

              $javaProcesses =
                  Get-Process java `
                      -ErrorAction SilentlyContinue

              if (-not $javaProcesses) {

                  Write-Host ""
                  Write-Host "Minecraft Java process disappeared."

                  break
              }


              # ----------------------------------------------------
              # Check server log
              # ----------------------------------------------------

              if (Test-Path "$serverDir\server.log") {

                  $log =
                      Get-Content `
                          "$serverDir\server.log" `
                          -Raw `
                          -ErrorAction SilentlyContinue

                  if ($log -match "Done \(") {

                      Write-Host ""
                      Write-Host "Paper reports server startup completed."

                      $ready =
                          $true

                      break
                  }


                  if ($log -match
                      "UnsupportedClassVersionError") {

                      Write-Host ""
                      Write-Host "JAVA VERSION ERROR DETECTED."

                      break
                  }


                  if ($log -match
                      "Failed to bind to port") {

                      Write-Host ""
                      Write-Host "PORT BIND ERROR DETECTED."

                      break
                  }


                  if ($log -match
                      "Address already in use") {

                      Write-Host ""
                      Write-Host "PORT 25565 IS ALREADY IN USE."

                      break
                  }
              }

              Write-Host `
                  "Waiting for Minecraft... $i/120"
          }


          # ========================================================
          # PRINT LOGS
          # ========================================================

          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT SERVER LOG"
          Write-Host "========================================="

          if (Test-Path "$serverDir\server.log") {

              Get-Content `
                  "$serverDir\server.log" `
                  -Tail 200
          }


          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT ERROR LOG"
          Write-Host "========================================="

          if (Test-Path "$serverDir\server-error.log") {

              Get-Content `
                  "$serverDir\server-error.log" `
                  -Tail 200
          }


          # ========================================================
          # CHECK PROCESS
          # ========================================================

          Write-Host ""
          Write-Host "========================================="
          Write-Host " JAVA PROCESSES"
          Write-Host "========================================="

          Get-Process java `
              -ErrorAction SilentlyContinue |
              Select-Object `
                  Id,
                  ProcessName,
                  CPU,
                  WorkingSet64 |
              Format-Table


          # ========================================================
          # CHECK PORT
          # ========================================================

          Write-Host ""
          Write-Host "========================================="
          Write-Host " TCP PORT 25565"
          Write-Host "========================================="

          $connections =
              Get-NetTCPConnection `
                  -LocalPort 25565 `
                  -ErrorAction SilentlyContinue

          if ($connections) {

              $connections |
                  Format-Table `
                      LocalAddress,
                      LocalPort,
                      RemoteAddress,
                      RemotePort,
                      State,
                      OwningProcess
          }
          else {

              Write-Host `
                  "No TCP listener found on port 25565."
          }


          # ========================================================
          # FINAL LOCAL TEST
          # ========================================================

          Write-Host ""
          Write-Host "========================================="
          Write-Host " LOCAL CONNECTION TEST"
          Write-Host "========================================="

          $test =
              Test-NetConnection `
                  -ComputerName "127.0.0.1" `
                  -Port 25565 `
                  -WarningAction SilentlyContinue

          Write-Host ""
          Write-Host "TcpTestSucceeded:"
          Write-Host $test.TcpTestSucceeded

          Write-Host ""
          Write-Host "RemoteAddress:"
          Write-Host $test.RemoteAddress

          Write-Host ""
          Write-Host "RemotePort:"
          Write-Host $test.RemotePort


          if (-not $test.TcpTestSucceeded) {

              Write-Host ""
              Write-Host "========================================="
              Write-Host " SERVER IS NOT LISTENING"
              Write-Host "========================================="

              throw @"
          Minecraft did not open TCP port 25565.

          The diagnostic information above contains:
          - Paper server log
          - Java error log
          - Java process status
          - TCP listener status
          - Local connectivity test
          "@
          }


          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT PORT IS OPEN"
          Write-Host "========================================="


      # ============================================================
      # 13. VERIFY FIREWALL + PORT
      # ============================================================
      - name: 13. Verify Network
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " NETWORK VERIFICATION"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "Firewall rule:"

          Get-NetFirewallRule `
              -DisplayName "Minecraft Server TCP 25565" |
              Select-Object `
                  DisplayName,
                  Enabled,
                  Direction,
                  Action,
                  Profile |
              Format-List

          Write-Host ""
          Write-Host "TCP listener:"

          Get-NetTCPConnection `
              -LocalPort 25565 `
              -State Listen |
              Format-Table `
                  LocalAddress,
                  LocalPort,
                  State,
                  OwningProcess

          Write-Host ""
          Write-Host "127.0.0.1 test:"

          Test-NetConnection `
              127.0.0.1 `
              -Port 25565 `
              -WarningAction SilentlyContinue |
              Select-Object `
                  ComputerName,
                  RemotePort,
                  TcpTestSucceeded |
              Format-List


      # ============================================================
      # 14. INSTALL PLAYIT
      # ============================================================
      - name: 14. Install Playit
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " PLAYIT"
          Write-Host "========================================="

          winget install `
              --id DevelopedMethods.playit `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

          Start-Sleep -Seconds 5

          $playit =
              Get-ChildItem `
                  -Path "C:\Program Files",
                  "C:\Program Files (x86)" `
                  -Filter "playit.exe" `
                  -Recurse `
                  -File `
                  -ErrorAction SilentlyContinue |
              Select-Object -First 1

          if (-not $playit) {

              throw `
                  "playit.exe was not found."
          }

          Write-Host ""
          Write-Host "Playit:"
          Write-Host $playit.FullName

          "PLAYIT_EXE=$($playit.FullName)" |
              Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 15. START PLAYIT
      # ============================================================
      - name: 15. Start Playit Tunnel
        shell: powershell
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace(
              $env:PLAYIT_SECRET
          )) {

              throw @"
          PLAYIT_SECRET is missing.

          Go to:

          GitHub Repository
          ->
          Settings
          ->
          Secrets and variables
          ->
          Actions

          Create:

          Name:
          PLAYIT_SECRET

          Value:
          Your Playit secret/token
          "@
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " STARTING PLAYIT"
          Write-Host "========================================="

          $playitLog =
              "C:\Minecraft\playit.log"

          $playitError =
              "C:\Minecraft\playit-error.log"

          $arguments = @(
              "--secret",
              $env:PLAYIT_SECRET
          )

          $process =
              Start-Process `
                  -FilePath $env:PLAYIT_EXE `
                  -ArgumentList $arguments `
                  -WorkingDirectory "C:\Minecraft" `
                  -RedirectStandardOutput $playitLog `
                  -RedirectStandardError $playitError `
                  -PassThru

          $process.Id |
              Out-File `
              "C:\Minecraft\playit.pid" `
              -Encoding ASCII

          Write-Host ""
          Write-Host "Playit PID:"
          Write-Host $process.Id

          Start-Sleep -Seconds 15

          Write-Host ""
          Write-Host "========== PLAYIT LOG =========="

          if (Test-Path $playitLog) {

              Get-Content `
                  $playitLog `
                  -Tail 150
          }

          Write-Host ""
          Write-Host "========== PLAYIT ERROR =========="

          if (Test-Path $playitError) {

              Get-Content `
                  $playitError `
                  -Tail 150
          }


      # ============================================================
      # 16. DETECT PUBLIC ADDRESS
      # ============================================================
      - name: 16. Get Public Minecraft Address
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $logFile =
              "C:\Minecraft\playit.log"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " PUBLIC MINECRAFT ADDRESS"
          Write-Host "========================================="

          $publicAddress =
              $null

          for ($i = 1; $i -le 60; $i++) {

              Start-Sleep -Seconds 5

              if (-not (Test-Path $logFile)) {

                  Write-Host `
                      "Waiting for Playit log... $i/60"

                  continue
              }

              $log =
                  Get-Content `
                      $logFile `
                      -Raw `
                      -ErrorAction SilentlyContinue

              Write-Host `
                  "Checking Playit... $i/60"


              # ----------------------------------------------------
              # Common Playit address formats
              # ----------------------------------------------------

              $patterns = @(

                  '(?i)([a-z0-9.-]+\.playit\.gg):(\d+)',

                  '(?i)([a-z0-9.-]+\.gl\.at\.ply\.gg):(\d+)',

                  '(?i)([a-z0-9.-]+\.ply\.gg):(\d+)'

              )


              foreach ($pattern in $patterns) {

                  $matches =
                      [regex]::Matches(
                          $log,
                          $pattern
                      )

                  foreach ($match in $matches) {

                      $hostName =
                          $match.Groups[1].Value

                      $port =
                          $match.Groups[2].Value

                      if ($port -ne "25565") {

                          $publicAddress =
                              "$hostName`:$port"

                          break
                      }
                  }

                  if ($publicAddress) {
                      break
                  }
              }


              if ($publicAddress) {
                  break
              }
          }


          Write-Host ""
          Write-Host "========================================="
          Write-Host " PLAYIT FINAL LOG"
          Write-Host "========================================="

          if (Test-Path $logFile) {

              Get-Content `
                  $logFile `
                  -Tail 200
          }


          Write-Host ""
          Write-Host "========================================="
          Write-Host " PLAYIT ERROR LOG"
          Write-Host "========================================="

          if (Test-Path "C:\Minecraft\playit-error.log") {

              Get-Content `
                  "C:\Minecraft\playit-error.log" `
                  -Tail 100
          }


          if (-not $publicAddress) {

              throw `
                  "Playit started but public Minecraft address could not be detected."
          }


          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT PUBLIC ADDRESS"
          Write-Host "========================================="

          Write-Host ""
          Write-Host $publicAddress

          Write-Host ""
          Write-Host "Minecraft Java:"
          Write-Host "1.21.9"

          Write-Host ""
          Write-Host "Players:"
          Write-Host "5"

          Write-Host ""
          Write-Host "RAM:"
          Write-Host $env:MINECRAFT_RAM

          "MINECRAFT_PUBLIC_ADDRESS=$publicAddress" |
              Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          @"
          # 🎮 Minecraft Server

          ## Public Address

          **$publicAddress**

          ## Version

          Minecraft Java **1.21.9**

          ## Players

          **5**

          ## RAM

          **$env:MINECRAFT_RAM**

          ## Paper Build

          **$env:PAPER_BUILD**

          ## Paper Channel

          **$env:PAPER_CHANNEL**

          The server is running on this GitHub Actions runner.
          "@ |
              Out-File `
              $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8


      # ============================================================
      # 17. FINAL CHECK
      # ============================================================
      - name: 17. Final Check
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host ""
          Write-Host "################################################"
          Write-Host "#                                              #"
          Write-Host "#       MINECRAFT SERVER IS READY              #"
          Write-Host "#                                              #"
          Write-Host "################################################"

          Write-Host ""
          Write-Host "PUBLIC ADDRESS:"
          Write-Host $env:MINECRAFT_PUBLIC_ADDRESS

          Write-Host ""
          Write-Host "VERSION:"
          Write-Host "Minecraft Java 1.21.9"

          Write-Host ""
          Write-Host "PLAYERS:"
          Write-Host "5"

          Write-Host ""
          Write-Host "RAM:"
          Write-Host $env:MINECRAFT_RAM

          Write-Host ""
          Write-Host "PAPER:"
          Write-Host "Build $env:PAPER_BUILD"

          Write-Host ""
          Write-Host "JAVA:"
          Write-Host $env:JAVA21_PATH

          Write-Host ""
          Write-Host "LOCAL PORT:"
          Write-Host "25565"

          Write-Host ""
          Write-Host "################################################"


      # ============================================================
      # 18. KEEP SERVER ALIVE
      # ============================================================
      - name: 18. Keep Server Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " SERVER RUNNING"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "Minecraft:"
          Write-Host "1.21.9"

          Write-Host ""
          Write-Host "Address:"
          Write-Host $env:MINECRAFT_PUBLIC_ADDRESS

          Write-Host ""
          Write-Host "Players:"
          Write-Host "5"

          Write-Host ""

          # GitHub-hosted runner maximum:
          # 360 minutes.
          #
          # Setup consumes some time.
          # Keep server alive for ~5h45m.

          for ($i = 1; $i -le 345; $i++) {

              Start-Sleep -Seconds 60

              $minecraft =
                  Get-Process java `
                      -ErrorAction SilentlyContinue

              if (-not $minecraft) {

                  Write-Host ""
                  Write-Host "Minecraft process stopped."

                  if (Test-Path "C:\Minecraft\server.log") {

                      Get-Content `
                          "C:\Minecraft\server.log" `
                          -Tail 100
                  }

                  exit 1
              }

              $listener =
                  Get-NetTCPConnection `
                      -LocalPort 25565 `
                      -State Listen `
                      -ErrorAction SilentlyContinue

              if (-not $listener) {

                  Write-Host ""
                  Write-Host `
                      "WARNING: Minecraft is running but port 25565 is not listening."
              }

              Write-Host `
                  "[$i/345] Minecraft running | PID $($minecraft.Id)"
          }


      # ============================================================
      # 19. UPLOAD LOGS
      # ============================================================
      - name: 19. Upload Server Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-logs
          path: C:\Minecraft
          if-no-files-found: ignore
          retention-days: 1
