name: Minecraft Java Server 1.21.9

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. SYSTEM INFO
      # =========================================================
      - name: 1. System Information
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host " SYSTEM INFORMATION"
          Write-Host "========================================="

          $os = Get-CimInstance Win32_OperatingSystem

          $ram = [math]::Round(
              $os.TotalVisibleMemorySize / 1MB,
              2
          )

          Write-Host "OS: $($os.Caption)"
          Write-Host "RAM: $ram GB"

          $cpu = Get-CimInstance Win32_Processor

          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Logical CPUs: $($cpu.NumberOfLogicalProcessors)"


      # =========================================================
      # 2. JAVA 21
      # =========================================================
      - name: 2. Install Java 21
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Java 21..."

          $javaOK = $false

          try {
              $javaOutput = & java -version 2>&1 | Out-String

              Write-Host $javaOutput

              if ($javaOutput -match 'version "21\.') {
                  $javaOK = $true
              }
          }
          catch {
              $javaOK = $false
          }

          if (-not $javaOK) {

              Write-Host "Java 21 not found."
              Write-Host "Installing Temurin 21..."

              winget install `
                --id EclipseAdoptium.Temurin.21.JDK `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

              $env:Path = `
                [System.Environment]::GetEnvironmentVariable("Path","Machine") `
                + ";" `
                + [System.Environment]::GetEnvironmentVariable("Path","User")

              Start-Sleep -Seconds 5
          }

          Write-Host ""
          Write-Host "FINAL JAVA VERSION:"
          java -version


      # =========================================================
      # 3. CREATE SERVER DIRECTORY
      # =========================================================
      - name: 3. Create Minecraft Directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $serverDir = "C:\Minecraft"

          if (Test-Path $serverDir) {
              Remove-Item `
                $serverDir `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $serverDir `
            -Force |
            Out-Null

          Write-Host "Created: $serverDir"


      # =========================================================
      # 4. DOWNLOAD PAPER 1.21.9
      # =========================================================
      - name: 4. Download Paper 1.21.9
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $minecraftVersion = "1.21.9"
          $serverDir = "C:\Minecraft"

          $api = "https://fill.papermc.io/v3/projects/paper/versions/$minecraftVersion/builds"

          $headers = @{
              "User-Agent" = "Minecraft-GitHub-Actions-Server/1.0 (https://github.com/)"
              "Accept"     = "application/json"
          }

          Write-Host "========================================="
          Write-Host " PAPER DOWNLOAD"
          Write-Host "========================================="

          Write-Host "Minecraft version:"
          Write-Host $minecraftVersion

          Write-Host ""
          Write-Host "API:"
          Write-Host $api

          $builds = Invoke-RestMethod `
              -Uri $api `
              -Headers $headers `
              -Method Get

          if (-not $builds) {
              throw "Paper API returned no builds."
          }

          Write-Host ""
          Write-Host "Available builds:"

          foreach ($build in $builds) {
              Write-Host "Build $($build.id) | Channel: $($build.channel)"
          }

          # =====================================================
          # IMPORTANT:
          # 1.21.9 has no STABLE Paper build.
          # Therefore we use the newest available build.
          # =====================================================

          $latestBuild = $builds |
              Sort-Object {
                  [int]$_.id
              } -Descending |
              Select-Object -First 1

          if (-not $latestBuild) {
              throw "Could not find any Paper build."
          }

          $buildNumber = $latestBuild.id
          $channel = $latestBuild.channel

          $downloadUrl =
              $latestBuild.downloads."server:default".url

          if (-not $downloadUrl) {
              throw "Paper download URL not found."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " SELECTED PAPER BUILD"
          Write-Host "========================================="

          Write-Host "Minecraft: $minecraftVersion"
          Write-Host "Build: $buildNumber"
          Write-Host "Channel: $channel"

          Write-Host ""
          Write-Host "Download:"
          Write-Host $downloadUrl

          Write-Host ""
          Write-Host "Downloading..."

          Invoke-WebRequest `
              -Uri $downloadUrl `
              -Headers $headers `
              -OutFile "$serverDir\paper.jar"

          if (-not (Test-Path "$serverDir\paper.jar")) {
              throw "paper.jar was not downloaded."
          }

          $sizeMB = [math]::Round(
              (Get-Item "$serverDir\paper.jar").Length / 1MB,
              2
          )

          Write-Host ""
          Write-Host "SUCCESS"
          Write-Host "Paper Build: $buildNumber"
          Write-Host "Channel: $channel"
          Write-Host "Size: $sizeMB MB"

          "PAPER_BUILD=$buildNumber" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PAPER_CHANNEL=$channel" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # =========================================================
      # 5. EULA
      # =========================================================
      - name: 5. Accept Minecraft EULA
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location C:\Minecraft

          "eula=true" |
            Set-Content `
            -Path "eula.txt" `
            -Encoding ASCII

          Write-Host "Minecraft EULA accepted."


      # =========================================================
      # 6. SERVER CONFIG
      # =========================================================
      - name: 6. Configure Minecraft Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $serverDir = "C:\Minecraft"

          $properties = @"
          server-port=25565
          server-ip=
          max-players=5
          online-mode=true
          difficulty=normal
          gamemode=survival
          pvp=true
          spawn-protection=0
          view-distance=8
          simulation-distance=6
          enable-command-block=false
          enable-status=true
          allow-flight=false
          white-list=false
          enforce-whitelist=false
          motd=Aria Minecraft Server 1.21.9
          "@

          $properties |
            Set-Content `
            -Path "$serverDir\server.properties" `
            -Encoding ASCII

          Write-Host ""
          Write-Host "SERVER CONFIG:"
          Get-Content "$serverDir\server.properties"


      # =========================================================
      # 7. FIREWALL
      # =========================================================
      - name: 7. Configure Windows Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring Windows Firewall..."

          Get-NetFirewallRule `
            -DisplayName "Minecraft Server TCP 25565" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "Minecraft Server TCP 25565" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 25565 `
            -Action Allow `
            -Profile Any

          Write-Host ""
          Write-Host "Firewall rule created."

          Get-NetFirewallRule `
            -DisplayName "Minecraft Server TCP 25565" |
            Format-List `
              DisplayName,
              Enabled,
              Direction,
              Action


      # =========================================================
      # 8. RAM
      # =========================================================
      - name: 8. Configure RAM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $totalRAM = [math]::Round(
              (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB,
              1
          )

          Write-Host "Total RAM: $totalRAM GB"

          if ($totalRAM -ge 8) {
              $minecraftRAM = "6G"
          }
          elseif ($totalRAM -ge 6) {
              $minecraftRAM = "4G"
          }
          else {
              $minecraftRAM = "3G"
          }

          Write-Host "Minecraft RAM: $minecraftRAM"

          "MINECRAFT_RAM=$minecraftRAM" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # =========================================================
      # 9. START MINECRAFT
      # =========================================================
      - name: 9. Start Minecraft Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location C:\Minecraft

          Write-Host "Starting Minecraft..."

          $javaArgs = @(
              "-Xms$env:MINECRAFT_RAM",
              "-Xmx$env:MINECRAFT_RAM",
              "-XX:+UseG1GC",
              "-XX:+ParallelRefProcEnabled",
              "-XX:MaxGCPauseMillis=200",
              "-jar",
              "paper.jar",
              "--nogui"
          )

          $process = Start-Process `
              -FilePath "java" `
              -ArgumentList $javaArgs `
              -WorkingDirectory "C:\Minecraft" `
              -RedirectStandardOutput "C:\Minecraft\server.log" `
              -RedirectStandardError "C:\Minecraft\server-error.log" `
              -PassThru

          $process.Id |
              Out-File `
              "C:\Minecraft\server.pid" `
              -Encoding ASCII

          Write-Host "Minecraft PID: $($process.Id)"

          Write-Host ""
          Write-Host "Waiting for Minecraft..."

          $ready = $false

          for ($i = 1; $i -le 90; $i++) {

              Start-Sleep -Seconds 2

              if (Test-Path "C:\Minecraft\server.log") {

                  $log = Get-Content `
                      "C:\Minecraft\server.log" `
                      -Raw `
                      -ErrorAction SilentlyContinue

                  if ($log -match "Done \(") {
                      $ready = $true
                      break
                  }

                  if ($log -match "Failed to start") {
                      break
                  }
              }

              Write-Host "Waiting... $i/90"
          }

          if (-not $ready) {

              Write-Host ""
              Write-Host "========== SERVER LOG =========="

              if (Test-Path "C:\Minecraft\server.log") {
                  Get-Content `
                    "C:\Minecraft\server.log" `
                    -Tail 100
              }

              Write-Host ""
              Write-Host "========== SERVER ERROR =========="

              if (Test-Path "C:\Minecraft\server-error.log") {
                  Get-Content `
                    "C:\Minecraft\server-error.log" `
                    -Tail 100
              }

              throw "Minecraft server failed to start."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT SERVER READY"
          Write-Host "========================================="


      # =========================================================
      # 10. LOCAL TEST
      # =========================================================
      - name: 10. Test Minecraft Port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Testing localhost:25565..."

          $test = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 25565 `
              -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
              throw "Minecraft port 25565 is NOT open."
          }

          Write-Host ""
          Write-Host "SUCCESS!"
          Write-Host "127.0.0.1:25565 is OPEN."


      # =========================================================
      # 11. INSTALL PLAYIT
      # =========================================================
      - name: 11. Install Playit
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing Playit..."

          winget install `
            --id DevelopedMethods.playit `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          $env:Path = `
            [System.Environment]::GetEnvironmentVariable("Path","Machine") `
            + ";" `
            + [System.Environment]::GetEnvironmentVariable("Path","User")

          Start-Sleep -Seconds 5

          $playit = Get-ChildItem `
            -Path "C:\Program Files","C:\Program Files (x86)" `
            -Filter "playit.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $playit) {
              throw "playit.exe was not found."
          }

          Write-Host ""
          Write-Host "Playit:"
          Write-Host $playit.FullName

          "PLAYIT_EXE=$($playit.FullName)" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # =========================================================
      # 12. START PLAYIT
      # =========================================================
      - name: 12. Start Playit Tunnel
        shell: powershell
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:PLAYIT_SECRET)) {

              throw @"
          PLAYIT_SECRET is missing.

          GitHub:
          Settings
          ->
          Secrets and variables
          ->
          Actions
          ->
          New repository secret

          Name:
          PLAYIT_SECRET
          "@
          }

          Write-Host "Starting Playit..."

          $playitLog = "C:\Minecraft\playit.log"
          $playitError = "C:\Minecraft\playit-error.log"

          $args = @(
              "--secret",
              $env:PLAYIT_SECRET
          )

          $process = Start-Process `
              -FilePath $env:PLAYIT_EXE `
              -ArgumentList $args `
              -WorkingDirectory "C:\Minecraft" `
              -RedirectStandardOutput $playitLog `
              -RedirectStandardError $playitError `
              -PassThru

          $process.Id |
              Out-File `
              "C:\Minecraft\playit.pid" `
              -Encoding ASCII

          Write-Host "Playit PID: $($process.Id)"

          Start-Sleep -Seconds 15

          Write-Host ""
          Write-Host "========== PLAYIT LOG =========="

          if (Test-Path $playitLog) {
              Get-Content `
                $playitLog `
                -Tail 100
          }


      # =========================================================
      # 13. FIND PUBLIC ADDRESS
      # =========================================================
      - name: 13. Find Public Minecraft Address
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $logFile = "C:\Minecraft\playit.log"

          Write-Host ""
          Write-Host "Waiting for public Playit address..."

          $publicAddress = $null

          for ($i = 1; $i -le 36; $i++) {

              Start-Sleep -Seconds 5

              if (-not (Test-Path $logFile)) {
                  continue
              }

              $log = Get-Content `
                  $logFile `
                  -Raw `
                  -ErrorAction SilentlyContinue

              # Playit standard public address
              $matches = [regex]::Matches(
                  $log,
                  '(?i)([a-z0-9.-]+\.(?:playit\.gg|gl\.at\.ply\.gg)):(\d+)'
              )

              foreach ($match in $matches) {

                  $hostName = $match.Groups[1].Value
                  $port = $match.Groups[2].Value

                  if ($port -ne "25565") {
                      $publicAddress = "$hostName`:$port"
                      break
                  }
              }

              if ($publicAddress) {
                  break
              }

              Write-Host "Not found yet... $i/36"
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT CONNECTION"
          Write-Host "========================================="

          if ($publicAddress) {

              Write-Host ""
              Write-Host "PUBLIC ADDRESS:"
              Write-Host $publicAddress

              Write-Host ""
              Write-Host "Minecraft Java:"
              Write-Host "1.21.9"

              Write-Host ""
              Write-Host "Players:"
              Write-Host "5"

              Write-Host ""
              Write-Host "========================================="

              "MINECRAFT_PUBLIC_ADDRESS=$publicAddress" |
                  Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

              @"
          # Minecraft Server

          ## Connection

          **$publicAddress**

          ## Version

          Minecraft Java 1.21.9

          ## Max Players

          5

          ## Paper Build

          $env:PAPER_BUILD

          ## Paper Channel

          $env:PAPER_CHANNEL
          "@ |
              Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8

          }
          else {

              Write-Host ""
              Write-Host "PUBLIC ADDRESS WAS NOT DETECTED."

              Write-Host ""
              Write-Host "========== FULL PLAYIT LOG =========="

              if (Test-Path $logFile) {
                  Get-Content $logFile
              }

              Write-Host ""
              Write-Host "========== PLAYIT ERROR =========="

              if (Test-Path "C:\Minecraft\playit-error.log") {
                  Get-Content `
                    "C:\Minecraft\playit-error.log"
              }

              throw "Could not detect Playit public address."
          }


      # =========================================================
      # 14. FINAL STATUS
      # =========================================================
      - name: 14. Final Server Status
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host " FINAL STATUS"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "Minecraft process:"

          Get-Process java `
            -ErrorAction SilentlyContinue |
            Select-Object `
              Id,
              ProcessName,
              CPU,
              WorkingSet64

          Write-Host ""
          Write-Host "Minecraft listening port:"

          Get-NetTCPConnection `
            -LocalPort 25565 `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Format-Table `
              LocalAddress,
              LocalPort,
              State,
              OwningProcess

          Write-Host ""
          Write-Host "PUBLIC ADDRESS:"

          if ($env:MINECRAFT_PUBLIC_ADDRESS) {
              Write-Host $env:MINECRAFT_PUBLIC_ADDRESS
          }


      # =========================================================
      # 15. KEEP ALIVE
      # =========================================================
      - name: 15. Keep Server Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT SERVER RUNNING"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "PUBLIC ADDRESS:"
          Write-Host $env:MINECRAFT_PUBLIC_ADDRESS

          Write-Host ""
          Write-Host "Minecraft Version: 1.21.9"
          Write-Host "Paper Build: $env:PAPER_BUILD"
          Write-Host "Players: 5"
          Write-Host "Port: 25565"
          Write-Host ""

          # GitHub timeout = 360 minutes
          # Keep alive for approximately 5h45m

          for ($i = 1; $i -le 345; $i++) {

              Start-Sleep -Seconds 60

              $minecraft = Get-Process java `
                  -ErrorAction SilentlyContinue

              if (-not $minecraft) {

                  Write-Host ""
                  Write-Host "Minecraft stopped unexpectedly."

                  if (Test-Path "C:\Minecraft\server.log") {
                      Get-Content `
                        "C:\Minecraft\server.log" `
                        -Tail 100
                  }

                  exit 1
              }

              Write-Host `
                "[$i/345] Minecraft running | PID: $($minecraft.Id)"
          }


      # =========================================================
      # 16. SAVE LOGS
      # =========================================================
      - name: 16. Upload Minecraft Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-logs
          path: C:\Minecraft
          if-no-files-found: ignore
          retention-days: 1
