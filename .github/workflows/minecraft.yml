name: Minecraft Java Server 1.21.9

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: 1. System Information
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " SYSTEM INFORMATION"
          Write-Host "========================================="

          $os = Get-CimInstance Win32_OperatingSystem

          $ram = [math]::Round(
              $os.TotalVisibleMemorySize / 1MB,
              2
          )

          Write-Host "OS: $($os.Caption)"
          Write-Host "RAM: $ram GB"

          $cpu = Get-CimInstance Win32_Processor

          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Logical CPUs: $($cpu.NumberOfLogicalProcessors)"


      # =========================================================
      # 2. INSTALL JAVA 21
      # =========================================================
      - name: 2. Install Java 21
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " INSTALLING JAVA 21"
          Write-Host "========================================="

          winget install `
            --id EclipseAdoptium.Temurin.21.JDK `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          Write-Host ""
          Write-Host "Java 21 installation command completed."

          Start-Sleep -Seconds 8


      # =========================================================
      # 3. FIND JAVA 21
      # =========================================================
      - name: 3. Find Java 21
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " FINDING JAVA 21"
          Write-Host "========================================="

          $java21 = $null

          # -----------------------------------------------------
          # Possible Java 21 installation locations
          # -----------------------------------------------------

          $candidatePaths = @(
              "C:\Program Files\Eclipse Adoptium\jdk-21*\bin\java.exe",
              "C:\Program Files\Eclipse Adoptium\jdk-21.*\bin\java.exe",
              "C:\Program Files\Java\jdk-21*\bin\java.exe",
              "C:\Program Files\AdoptOpenJDK\jdk-21*\bin\java.exe"
          )

          Write-Host ""
          Write-Host "Checking standard installation paths..."

          foreach ($pattern in $candidatePaths) {

              Write-Host ""
              Write-Host "Checking:"
              Write-Host $pattern

              $files = Get-ChildItem `
                  -Path $pattern `
                  -File `
                  -ErrorAction SilentlyContinue

              foreach ($file in $files) {

                  Write-Host ""
                  Write-Host "Candidate:"
                  Write-Host $file.FullName

                  try {

                      # java -version writes to STDERR on Windows.
                      # Therefore temporarily allow native stderr.

                      $oldPreference = $ErrorActionPreference
                      $ErrorActionPreference = "Continue"

                      $versionText = (
                          & $file.FullName -version 2>&1 |
                          Out-String
                      )

                      $ErrorActionPreference = $oldPreference

                      Write-Host $versionText

                      if ($versionText -match 'version "21\.') {

                          $java21 = $file.FullName
                          break
                      }

                  }
                  catch {

                      $ErrorActionPreference = "Stop"

                      Write-Host "Could not test this candidate."
                  }
              }

              if ($java21) {
                  break
              }
          }


          # -----------------------------------------------------
          # FALLBACK:
          # Search Eclipse Adoptium directory directly
          # -----------------------------------------------------

          if (-not $java21) {

              Write-Host ""
              Write-Host "Standard paths did not find Java 21."
              Write-Host "Searching Eclipse Adoptium directory..."

              $adoptiumRoot =
                  "C:\Program Files\Eclipse Adoptium"

              if (Test-Path $adoptiumRoot) {

                  $directories = Get-ChildItem `
                      -Path $adoptiumRoot `
                      -Directory `
                      -ErrorAction SilentlyContinue

                  foreach ($directory in $directories) {

                      Write-Host ""
                      Write-Host "Checking directory:"
                      Write-Host $directory.FullName

                      $possibleJava =
                          Join-Path `
                          $directory.FullName `
                          "bin\java.exe"

                      if (Test-Path $possibleJava) {

                          $oldPreference =
                              $ErrorActionPreference

                          $ErrorActionPreference =
                              "Continue"

                          $versionText = (
                              & $possibleJava -version 2>&1 |
                              Out-String
                          )

                          $ErrorActionPreference =
                              $oldPreference

                          Write-Host $versionText

                          if ($versionText -match 'version "21\.') {

                              $java21 = $possibleJava
                              break
                          }
                      }
                  }
              }
          }


          # -----------------------------------------------------
          # FINAL VALIDATION
          # -----------------------------------------------------

          if (-not $java21) {

              Write-Host ""
              Write-Host "========================================="
              Write-Host " JAVA 21 NOT FOUND"
              Write-Host "========================================="

              Write-Host ""
              Write-Host "Eclipse Adoptium directory:"

              if (Test-Path "C:\Program Files\Eclipse Adoptium") {

                  Get-ChildItem `
                      "C:\Program Files\Eclipse Adoptium" `
                      -Recurse `
                      -ErrorAction SilentlyContinue |
                      Select-Object FullName |
                      Out-Host
              }

              Write-Host ""
              Write-Host "Current java.exe locations:"

              where.exe java 2>&1 |
                  Out-Host

              Write-Host ""
              Write-Host "Current default Java:"

              $oldPreference =
                  $ErrorActionPreference

              $ErrorActionPreference =
                  "Continue"

              & java -version 2>&1 |
                  Out-Host

              $ErrorActionPreference =
                  $oldPreference

              throw "Java 21 was installed but could not be located."
          }


          # -----------------------------------------------------
          # SUCCESS
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "========================================="
          Write-Host " JAVA 21 FOUND"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "Java 21 executable:"
          Write-Host $java21

          Write-Host ""
          Write-Host "Java version:"

          $oldPreference =
              $ErrorActionPreference

          $ErrorActionPreference =
              "Continue"

          & $java21 -version 2>&1 |
              Out-Host

          $ErrorActionPreference =
              $oldPreference


          # Save exact executable path
          "JAVA21_PATH=$java21" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          # Save JAVA_HOME
          $javaBin =
              Split-Path `
              $java21 `
              -Parent

          $javaHome =
              Split-Path `
              $javaBin `
              -Parent

          "JAVA_HOME=$javaHome" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          Write-Host ""
          Write-Host "JAVA_HOME:"
          Write-Host $javaHome


      # =========================================================
      # 4. VERIFY JAVA 21
      # =========================================================
      - name: 4. Verify Java 21
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " VERIFYING JAVA 21"
          Write-Host "========================================="

          if (-not $env:JAVA21_PATH) {
              throw "JAVA21_PATH environment variable is missing."
          }

          if (-not (Test-Path $env:JAVA21_PATH)) {
              throw "Java executable does not exist:"
              + $env:JAVA21_PATH
          }

          Write-Host ""
          Write-Host "Executable:"
          Write-Host $env:JAVA21_PATH

          $oldPreference =
              $ErrorActionPreference

          $ErrorActionPreference =
              "Continue"

          $javaVersion = (
              & $env:JAVA21_PATH -version 2>&1 |
              Out-String
          )

          $ErrorActionPreference =
              $oldPreference

          Write-Host ""
          Write-Host $javaVersion

          if ($javaVersion -notmatch 'version "21\.') {

              throw "The selected Java executable is NOT Java 21."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " JAVA 21 VERIFIED"
          Write-Host "========================================="


      # =========================================================
      # 5. CREATE MINECRAFT DIRECTORY
      # =========================================================
      - name: 5. Create Minecraft Directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $serverDir = "C:\Minecraft"

          if (Test-Path $serverDir) {

              Remove-Item `
                  $serverDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $serverDir `
              -Force |
              Out-Null

          Write-Host ""
          Write-Host "Minecraft directory:"
          Write-Host $serverDir


      # =========================================================
      # 6. DOWNLOAD PAPER 1.21.9
      # =========================================================
      - name: 6. Download Paper 1.21.9
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $minecraftVersion = "1.21.9"
          $serverDir = "C:\Minecraft"

          $api =
              "https://fill.papermc.io/v3/projects/paper/versions/$minecraftVersion/builds"

          $headers = @{
              "User-Agent" = "Minecraft-GitHub-Actions-Server/1.0"
              "Accept" = "application/json"
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " PAPER DOWNLOAD"
          Write-Host "========================================="

          Write-Host "Minecraft version:"
          Write-Host $minecraftVersion

          Write-Host ""
          Write-Host "API:"
          Write-Host $api

          $builds = Invoke-RestMethod `
              -Uri $api `
              -Headers $headers `
              -Method Get

          if (-not $builds) {
              throw "Paper API returned no builds."
          }

          Write-Host ""
          Write-Host "Available builds:"

          foreach ($build in $builds) {

              Write-Host `
                  "Build $($build.id) | Channel: $($build.channel)"
          }

          # 1.21.9 currently does not have a STABLE build.
          # Use newest available build.

          $latestBuild =
              $builds |
              Sort-Object {
                  [int]$_.id
              } -Descending |
              Select-Object -First 1

          if (-not $latestBuild) {
              throw "No Paper build found."
          }

          $buildNumber =
              $latestBuild.id

          $channel =
              $latestBuild.channel

          $downloadUrl =
              $latestBuild.downloads."server:default".url

          if (-not $downloadUrl) {
              throw "Paper download URL not found."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " SELECTED PAPER"
          Write-Host "========================================="

          Write-Host "Minecraft: $minecraftVersion"
          Write-Host "Build: $buildNumber"
          Write-Host "Channel: $channel"

          Write-Host ""
          Write-Host "Downloading:"
          Write-Host $downloadUrl

          Invoke-WebRequest `
              -Uri $downloadUrl `
              -Headers $headers `
              -OutFile "$serverDir\paper.jar"

          if (-not (Test-Path "$serverDir\paper.jar")) {
              throw "paper.jar was not downloaded."
          }

          $sizeMB = [math]::Round(
              (Get-Item "$serverDir\paper.jar").Length / 1MB,
              2
          )

          Write-Host ""
          Write-Host "Paper downloaded."
          Write-Host "Build: $buildNumber"
          Write-Host "Channel: $channel"
          Write-Host "Size: $sizeMB MB"

          "PAPER_BUILD=$buildNumber" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PAPER_CHANNEL=$channel" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # =========================================================
      # 7. ACCEPT EULA
      # =========================================================
      - name: 7. Accept Minecraft EULA
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          "eula=true" |
              Set-Content `
              -Path "C:\Minecraft\eula.txt" `
              -Encoding ASCII

          Write-Host "Minecraft EULA accepted."


      # =========================================================
      # 8. SERVER CONFIGURATION
      # =========================================================
      - name: 8. Configure Minecraft Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $properties = @"
          server-port=25565
          server-ip=
          max-players=5
          online-mode=true
          difficulty=normal
          gamemode=survival
          pvp=true
          spawn-protection=0
          view-distance=8
          simulation-distance=6
          enable-command-block=false
          enable-status=true
          allow-flight=false
          white-list=false
          enforce-whitelist=false
          motd=Aria Minecraft Server 1.21.9
          "@

          $properties |
              Set-Content `
              -Path "C:\Minecraft\server.properties" `
              -Encoding ASCII

          Write-Host ""
          Write-Host "SERVER CONFIGURATION:"
          Write-Host ""

          Get-Content `
              "C:\Minecraft\server.properties"


      # =========================================================
      # 9. WINDOWS FIREWALL
      # =========================================================
      - name: 9. Configure Windows Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " WINDOWS FIREWALL"
          Write-Host "========================================="

          Get-NetFirewallRule `
              -DisplayName "Minecraft Server TCP 25565" `
              -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule `
              -ErrorAction SilentlyContinue

          New-NetFirewallRule `
              -DisplayName "Minecraft Server TCP 25565" `
              -Direction Inbound `
              -Protocol TCP `
              -LocalPort 25565 `
              -Action Allow `
              -Profile Any

          Write-Host ""
          Write-Host "Firewall rule created."


      # =========================================================
      # 10. CONFIGURE RAM
      # =========================================================
      - name: 10. Configure Minecraft RAM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $totalRAM = [math]::Round(
              (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB,
              1
          )

          Write-Host ""
          Write-Host "Total RAM: $totalRAM GB"

          if ($totalRAM -ge 8) {

              $minecraftRAM = "6G"

          }
          elseif ($totalRAM -ge 6) {

              $minecraftRAM = "4G"

          }
          else {

              $minecraftRAM = "3G"
          }

          Write-Host "Minecraft RAM: $minecraftRAM"

          "MINECRAFT_RAM=$minecraftRAM" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # =========================================================
      # 11. START MINECRAFT
      # =========================================================
      - name: 11. Start Minecraft Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $serverDir = "C:\Minecraft"

          Set-Location $serverDir

          Write-Host ""
          Write-Host "========================================="
          Write-Host " STARTING MINECRAFT"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "Using Java:"
          Write-Host $env:JAVA21_PATH

          Write-Host ""
          Write-Host "Java version:"

          $oldPreference =
              $ErrorActionPreference

          $ErrorActionPreference =
              "Continue"

          & $env:JAVA21_PATH -version 2>&1 |
              Out-Host

          $ErrorActionPreference =
              $oldPreference

          Write-Host ""
          Write-Host "Minecraft RAM:"
          Write-Host $env:MINECRAFT_RAM

          # IMPORTANT:
          # Never use "java" here.
          # Use the exact Java 21 executable.

          $javaArgs = @(
              "-Xms$env:MINECRAFT_RAM",
              "-Xmx$env:MINECRAFT_RAM",
              "-XX:+UseG1GC",
              "-XX:+ParallelRefProcEnabled",
              "-XX:MaxGCPauseMillis=200",
              "-jar",
              "paper.jar",
              "--nogui"
          )

          $process = Start-Process `
              -FilePath $env:JAVA21_PATH `
              -ArgumentList $javaArgs `
              -WorkingDirectory $serverDir `
              -RedirectStandardOutput "$serverDir\server.log" `
              -RedirectStandardError "$serverDir\server-error.log" `
              -PassThru

          $process.Id |
              Out-File `
              "$serverDir\server.pid" `
              -Encoding ASCII

          Write-Host ""
          Write-Host "Minecraft PID: $($process.Id)"

          Write-Host ""
          Write-Host "Waiting for server..."

          $ready = $false

          for ($i = 1; $i -le 90; $i++) {

              Start-Sleep -Seconds 2

              if (Test-Path "$serverDir\server.log") {

                  $log = Get-Content `
                      "$serverDir\server.log" `
                      -Raw `
                      -ErrorAction SilentlyContinue

                  if ($log -match "Done \(") {

                      $ready = $true
                      break
                  }

                  if ($log -match "UnsupportedClassVersionError") {

                      Write-Host ""
                      Write-Host "JAVA VERSION ERROR!"

                      if (Test-Path "$serverDir\server-error.log") {

                          Get-Content `
                              "$serverDir\server-error.log" `
                              -Tail 100
                      }

                      throw `
                          "Minecraft is not running with Java 21."
                  }
              }

              Write-Host "Waiting... $i/90"
          }

          if (-not $ready) {

              Write-Host ""
              Write-Host "========================================="
              Write-Host " SERVER LOG"
              Write-Host "========================================="

              if (Test-Path "$serverDir\server.log") {

                  Get-Content `
                      "$serverDir\server.log" `
                      -Tail 150
              }

              Write-Host ""
              Write-Host "========================================="
              Write-Host " SERVER ERROR"
              Write-Host "========================================="

              if (Test-Path "$serverDir\server-error.log") {

                  Get-Content `
                      "$serverDir\server-error.log" `
                      -Tail 150
              }

              throw "Minecraft server failed to start."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT SERVER READY"
          Write-Host "========================================="


      # =========================================================
      # 12. TEST LOCAL MINECRAFT PORT
      # =========================================================
      - name: 12. Test Minecraft Port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "Testing 127.0.0.1:25565..."

          $result = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 25565 `
              -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {

              throw `
                  "Minecraft TCP port 25565 is NOT reachable."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " LOCAL MINECRAFT PORT OK"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "127.0.0.1:25565 is OPEN."


      # =========================================================
      # 13. INSTALL PLAYIT
      # =========================================================
      - name: 13. Install Playit
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " INSTALLING PLAYIT"
          Write-Host "========================================="

          winget install `
              --id DevelopedMethods.playit `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

          Start-Sleep -Seconds 5

          $env:Path =
              [System.Environment]::GetEnvironmentVariable(
                  "Path",
                  "Machine"
              ) `
              + ";" `
              + [System.Environment]::GetEnvironmentVariable(
                  "Path",
                  "User"
              )

          Write-Host ""
          Write-Host "Searching for playit.exe..."

          $playit = Get-ChildItem `
              -Path "C:\Program Files","C:\Program Files (x86)" `
              -Filter "playit.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

          if (-not $playit) {

              throw `
                  "playit.exe was not found after installation."
          }

          Write-Host ""
          Write-Host "Playit executable:"
          Write-Host $playit.FullName

          "PLAYIT_EXE=$($playit.FullName)" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # =========================================================
      # 14. START PLAYIT
      # =========================================================
      - name: 14. Start Playit Tunnel
        shell: powershell
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace(
              $env:PLAYIT_SECRET
          )) {

              throw @"
          PLAYIT_SECRET is missing.

          GitHub Repository:

          Settings
          ->
          Secrets and variables
          ->
          Actions
          ->
          New repository secret

          Name:

          PLAYIT_SECRET
          "@
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " STARTING PLAYIT"
          Write-Host "========================================="

          $playitLog =
              "C:\Minecraft\playit.log"

          $playitError =
              "C:\Minecraft\playit-error.log"

          $args = @(
              "--secret",
              $env:PLAYIT_SECRET
          )

          $process = Start-Process `
              -FilePath $env:PLAYIT_EXE `
              -ArgumentList $args `
              -WorkingDirectory "C:\Minecraft" `
              -RedirectStandardOutput $playitLog `
              -RedirectStandardError $playitError `
              -PassThru

          $process.Id |
              Out-File `
              "C:\Minecraft\playit.pid" `
              -Encoding ASCII

          Write-Host ""
          Write-Host "Playit PID:"
          Write-Host $process.Id

          Start-Sleep -Seconds 15

          Write-Host ""
          Write-Host "========== PLAYIT LOG =========="

          if (Test-Path $playitLog) {

              Get-Content `
                  $playitLog `
                  -Tail 100
          }

          Write-Host ""
          Write-Host "========== PLAYIT ERROR =========="

          if (Test-Path $playitError) {

              Get-Content `
                  $playitError `
                  -Tail 100
          }


      # =========================================================
      # 15. FIND PUBLIC ADDRESS
      # =========================================================
      - name: 15. Find Public Minecraft Address
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $logFile =
              "C:\Minecraft\playit.log"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " FINDING PUBLIC ADDRESS"
          Write-Host "========================================="

          $publicAddress = $null

          for ($i = 1; $i -le 36; $i++) {

              Start-Sleep -Seconds 5

              if (-not (Test-Path $logFile)) {

                  Write-Host `
                      "Playit log not ready... $i/36"

                  continue
              }

              $log = Get-Content `
                  $logFile `
                  -Raw `
                  -ErrorAction SilentlyContinue

              $matches = [regex]::Matches(
                  $log,
                  '(?i)([a-z0-9.-]+\.(?:playit\.gg|gl\.at\.ply\.gg)):(\d+)'
              )

              foreach ($match in $matches) {

                  $hostName =
                      $match.Groups[1].Value

                  $port =
                      $match.Groups[2].Value

                  if ($port -ne "25565") {

                      $publicAddress =
                          "$hostName`:$port"

                      break
                  }
              }

              if ($publicAddress) {
                  break
              }

              Write-Host `
                  "Public address not found yet... $i/36"
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT CONNECTION"
          Write-Host "========================================="

          if ($publicAddress) {

              Write-Host ""
              Write-Host "PUBLIC ADDRESS:"
              Write-Host $publicAddress

              Write-Host ""
              Write-Host "VERSION:"
              Write-Host "Minecraft Java 1.21.9"

              Write-Host ""
              Write-Host "MAX PLAYERS:"
              Write-Host "5"

              Write-Host ""

              "MINECRAFT_PUBLIC_ADDRESS=$publicAddress" |
                  Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

              @"
          # Minecraft Server

          ## Public Address

          **$publicAddress**

          ## Version

          Minecraft Java 1.21.9

          ## Max Players

          5

          ## Paper Build

          $env:PAPER_BUILD

          ## Paper Channel

          $env:PAPER_CHANNEL

          ## RAM

          $env:MINECRAFT_RAM
          "@ |
                  Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Encoding utf8
          }
          else {

              Write-Host ""
              Write-Host "PUBLIC ADDRESS NOT DETECTED."

              Write-Host ""
              Write-Host "========== PLAYIT LOG =========="

              if (Test-Path $logFile) {

                  Get-Content $logFile
              }

              Write-Host ""
              Write-Host "========== PLAYIT ERROR =========="

              if (Test-Path "C:\Minecraft\playit-error.log") {

                  Get-Content `
                      "C:\Minecraft\playit-error.log"
              }

              throw `
                  "Could not detect Playit public address."
          }


      # =========================================================
      # 16. FINAL STATUS
      # =========================================================
      - name: 16. Final Server Status
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host " FINAL SERVER STATUS"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "Java 21:"
          Write-Host $env:JAVA21_PATH

          Write-Host ""
          Write-Host "Minecraft RAM:"
          Write-Host $env:MINECRAFT_RAM

          Write-Host ""
          Write-Host "Minecraft process:"

          Get-Process `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.ProcessName -eq "java"
              } |
              Select-Object `
                  Id,
                  ProcessName,
                  CPU,
                  WorkingSet64

          Write-Host ""
          Write-Host "Listening on port 25565:"

          Get-NetTCPConnection `
              -LocalPort 25565 `
              -State Listen `
              -ErrorAction SilentlyContinue |
              Format-Table `
                  LocalAddress,
                  LocalPort,
                  State,
                  OwningProcess

          Write-Host ""
          Write-Host "========================================="
          Write-Host " PUBLIC MINECRAFT ADDRESS"
          Write-Host "========================================="

          Write-Host ""
          Write-Host $env:MINECRAFT_PUBLIC_ADDRESS


      # =========================================================
      # 17. KEEP SERVER ALIVE
      # =========================================================
      - name: 17. Keep Minecraft Server Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " MINECRAFT SERVER RUNNING"
          Write-Host "========================================="

          Write-Host ""
          Write-Host "PUBLIC ADDRESS:"
          Write-Host $env:MINECRAFT_PUBLIC_ADDRESS

          Write-Host ""
          Write-Host "Minecraft: 1.21.9"
          Write-Host "Paper Build: $env:PAPER_BUILD"
          Write-Host "Players: 5"
          Write-Host "RAM: $env:MINECRAFT_RAM"

          Write-Host ""

          # GitHub Actions maximum is 360 minutes.
          # Keep server alive approximately 5h45m.

          for ($i = 1; $i -le 345; $i++) {

              Start-Sleep -Seconds 60

              $minecraft =
                  Get-Process `
                      -ErrorAction SilentlyContinue |
                  Where-Object {
                      $_.ProcessName -eq "java"
                  }

              if (-not $minecraft) {

                  Write-Host ""
                  Write-Host "Minecraft stopped unexpectedly."

                  if (Test-Path "C:\Minecraft\server.log") {

                      Get-Content `
                          "C:\Minecraft\server.log" `
                          -Tail 100
                  }

                  exit 1
              }

              Write-Host `
                  "[$i/345] Minecraft running | PID: $($minecraft.Id)"
          }


      # =========================================================
      # 18. UPLOAD LOGS
      # =========================================================
      - name: 18. Upload Minecraft Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-logs
          path: C:\Minecraft
          if-no-files-found: ignore
          retention-days: 1
